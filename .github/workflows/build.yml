# Builds NetEmu on Windows, Linux and macOS and attaches the archives to the run.
# Push the project to GitHub (or run it from the Actions tab) to get all three builds.
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # every push / PR: the whole test suite (GUI included, offscreen) on all three systems
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-image0 libdbus-1-3
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] pytest-qt pyflakes
      - name: Lint
        run: python -m pyflakes netemu tools
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

  build:
    # release archives and the Windows installer: tags and manual runs only
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-image0 libdbus-1-3
      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] pyinstaller pytest-qt pyflakes
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests
      - name: Build
        run: python tools/build.py
      - name: Self-test of the packaged program (Linux, real X11 via Xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb
          xvfb-run -a -s "-screen 0 1600x1000x24" ./dist/NetEmu/NetEmu --self-test selftest
      - name: Self-test of the packaged program (macOS, Cocoa)
        if: runner.os == 'macOS'
        run: ./dist/NetEmu.app/Contents/MacOS/NetEmu --self-test selftest
      - name: Self-test of the packaged program (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\NetEmu\NetEmu.exe -ArgumentList '--self-test','selftest' -Wait -PassThru
          Get-Content selftest\report.json
          exit $p.ExitCode
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: selftest-${{ runner.os }}
          path: selftest/*
      - name: Linux package installs its own dependencies (clean Ubuntu and Fedora)
        if: runner.os == 'Linux'
        run: |
          tar -xzf release/NetEmu-*-linux-*.tar.gz -C /tmp
          for img in ubuntu:24.04 fedora:41; do
            echo "=== $img"
            docker run --rm -v /tmp/NetEmu:/opt/NetEmu "$img" sh -c 'NETEMU_ASSUME_YES=1 /opt/NetEmu/netemu.sh --check-deps'
          done
      - uses: actions/upload-artifact@v5
        with:
          name: NetEmu-${{ runner.os }}
          path: release/*

  release:
    # tags v*: publish a GitHub Release with the packages of all three systems
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: NetEmu-*
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          cat > notes.md <<'EOF'
          Downloads:

          - **Windows 10/11**: `NetEmu-*-setup.exe` (installer; fetches the Visual C++ runtime if it is missing) or the portable `*-windows-x64.zip`.
          - **Linux x86_64**: `*-linux-x86_64.tar.gz`, then run `./NetEmu/install.sh` (checks and installs the Qt system libraries).
          - **macOS**: `*-macos.zip`; the app is not notarized, so open it the first time with right-click → Open.

          See the README for details.
          EOF
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "NetEmu $TAG" --notes-file notes.md \
            || gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
