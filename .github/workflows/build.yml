# Builds NetEmu on Windows, Linux and macOS and attaches the archives to the run.
# Push the project to GitHub (or run it from the Actions tab) to get all three builds.
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # every push / PR: the whole test suite (GUI included, offscreen) on all three systems
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-image0 libdbus-1-3
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] pytest-qt pyflakes
      - name: Lint
        run: python -m pyflakes netemu tools
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

  build:
    # release archives and the Windows installer: tags and manual runs only
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-image0 libdbus-1-3
      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] pyinstaller pytest-qt pyflakes
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests
      - name: Build
        run: python tools/build.py
      - name: Linux package installs its own dependencies (clean Ubuntu and Fedora)
        if: runner.os == 'Linux'
        run: |
          tar -xzf release/NetEmu-*-linux-*.tar.gz -C /tmp
          for img in ubuntu:24.04 fedora:41; do
            echo "=== $img"
            docker run --rm -v /tmp/NetEmu:/opt/NetEmu "$img" sh -c 'NETEMU_ASSUME_YES=1 /opt/NetEmu/netemu.sh --check-deps'
          done
      - uses: actions/upload-artifact@v5
        with:
          name: NetEmu-${{ runner.os }}
          path: release/*
